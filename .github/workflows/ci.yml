name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Formatting, Clippy, docs, and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # explicit toolchain action revision
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-quality-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Deny Clippy warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Validate GitHub Actions workflows
        run: scripts/check-workflows.sh
      - name: Check release helper scripts
        run: shellcheck scripts/*.sh

  test:
    name: Tests (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [test, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # explicit toolchain action revision
        with:
          toolchain: 1.98.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Run workspace tests including doctests and screenshots
        env:
          TEST_PROFILE: ${{ matrix.profile }}
        run: cargo test --workspace --locked --profile "$TEST_PROFILE"
