[package]
name = "sol_net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
[dependencies]
sol_util = { path = "../util" }
sol_url = { path = "../url" }
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier", "gzip", "brotli"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
httpdate = "1"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
